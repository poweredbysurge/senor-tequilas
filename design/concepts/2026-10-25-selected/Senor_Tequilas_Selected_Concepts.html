document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-radius:50%;background:rgb(214,188,133);color:rgb(18,18,16);display:grid;place-items:center;font:400 15px 'Archivo Black'}.sign{border:3px solid rgb(214,188,133);outline:1px solid rgb(214,188,133);outline-offset:6px}<\u002Fstyle><\u002Fhelmet><section class=\"dv-turn\" id=\"t1\"><div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">Señor Tequila's seasonal pages · selected concepts<\u002Fspan><\u002Fdiv><div style=\"max-width:1000px;margin:0 0 28px;font:14px/1.55 system-ui,sans-serif;color:#1a1a1a;display:grid;gap:8px\"><div><b>Selected for build.<\u002Fb> Holiday Parties <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> The Room Tour, New Year's Eve <a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa> The Countdown, Birria Ramen <a class=\"dv-oid\" href=\"#3c\">3c<\u002Fa> Painted Sign. Desktop 1440 artboards.<\u002Fdiv><div><b>For the build.<\u002Fb> Brand tokens: page rgb(18,18,16), alt rgb(20,18,16), card rgb(28,27,24), raised rgb(35,33,28), hairline rgb(42,40,32) / rgb(58,56,47), gold rgb(214,188,133), cream rgb(246,239,228), body rgb(234,226,214), green rgb(56,176,73) on ink rgb(12,18,13). Fonts: Archivo Black, Barlow Condensed, Barlow, Special Elite (one moment per page). Cards 16px radius, buttons 12px / 52px tall, chips pill. Copy source: uploads/holiday-pages-copy-2026-10-24.md, verbatim in build (mocks condense). Blue numbered circles are annotations, not UI; the notes column beside each artboard lists layout and motion per section. Design mobile at 390 from these, collapsing grids to one column.<\u002Fdiv><\u002Fdiv><div class=\"dv-opts\"><!-- ===================== 1a ROOM TOUR ===================== -->\n<div class=\"dv-opt\" id=\"1a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>The Room Tour<\u002Fdiv>\n<div style=\"display:flex;gap:28px;align-items:flex-start\">\n<div class=\"dv-card art\">\n<div class=\"pv\">Preview for Señor Tequila's review. This page is not published yet.<\u002Fdiv>\n<div class=\"nav\"><div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:40px;height:40px;border-radius:50%;background:rgb(56,176,73)\"><\u002Fdiv><div style=\"font:700 14px 'Barlow Condensed';letter-spacing:.1em;color:rgb(246,239,228)\">SEÑOR TEQUILA'S<\u002Fdiv><\u002Fdiv><div class=\"navl\"><sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"9\"><div>{{ n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div style=\"display:flex;gap:10px\"><div class=\"gho\" style=\"height:40px;padding:0 18px\">Reserve<\u002Fdiv><div class=\"btn\" style=\"height:40px;padding:0 18px;box-shadow:none\">Order<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"height:880px\"><div class=\"nb\">1<\u002Fdiv>\n<div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO: Foyer through to the Mexican Room, holiday lights up, wide, dusk<\u002Fdiv>\n<div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,16,.05),rgba(18,18,16,.9) 75%)\"><\u002Fdiv>\n<div style=\"position:absolute;left:64px;right:440px;bottom:80px;display:grid;gap:22px\">\n<div class=\"eb\">Germantown, MD · Company and Family Holiday Parties · November and December<\u002Fdiv>\n<h1 class=\"h1\" style=\"font-size:84px\">A Holiday Party Venue With the Kitchen Already in the Room<\u002Fh1>\n<p class=\"p\" style=\"font-size:19px;max-width:620px\">Four private rooms that seat 48 to 112, or hold up to 134 standing. A mic and a big HDMI screen in every one. Fajita buffet from $26 a person, weekday rooms from $200 an hour.<\u002Fp>\n<div style=\"display:flex;gap:12px\"><div class=\"btn\">Book a Tour<\u002Fdiv><div class=\"gho\">Call 301-569-4574<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:absolute;right:64px;bottom:80px;width:300px;border-left:1px solid rgba(185,156,102,.45);padding-left:22px;display:grid;gap:14px\">\n<div class=\"eb\" style=\"color:rgba(234,226,214,.6)\">The tour, four rooms<\u002Fdiv>\n<sc-for list=\"{{ hp.rooms }}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\"><div style=\"font:600 16px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:rgb(246,239,228)\"><span style=\"color:rgb(214,188,133);margin-right:8px\">{{ r.n }}<\u002Fspan>{{ r.name }}<\u002Fdiv><div style=\"font:600 14px 'Barlow Condensed';letter-spacing:.06em;color:rgba(234,226,214,.7)\">{{ r.stand }} STANDING<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;display:grid;grid-template-columns:480px 1fr;gap:72px;align-items:center;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">2<\u002Fdiv>\n<div style=\"display:grid;gap:18px\"><div class=\"eb\">December fills from the weekends inward<\u002Fdiv><h2 class=\"h2\">The Weekends Are Going. Call Now.<\u002Fh2><p class=\"p\">Fridays and Saturdays in December go first, every year. Weeknights are the smart money: weekday rooms from $200 an hour, the same room, lights and food as a Saturday. We cannot do Thanksgiving, December 24 or 25.<\u002Fp><div style=\"display:flex;gap:12px\"><div class=\"btn\">Call 301-569-4574<\u002Fdiv><div class=\"gho\">Ask Tomas to hold a date<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div><div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px\"><div style=\"font:400 28px 'Archivo Black';color:rgb(246,239,228)\">December<\u002Fdiv><div style=\"display:flex;gap:16px;font:600 12px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase\"><span style=\"color:rgb(214,188,133)\">■ Weekend, call first<\u002Fspan><span style=\"color:rgba(234,226,214,.7)\">■ Open<\u002Fspan><span style=\"color:rgba(234,226,214,.35)\">■ Closed<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:6px\"><sc-for list=\"{{ hp.dow }}\" as=\"d\" hint-placeholder-count=\"7\"><div class=\"unit\" style=\"text-align:center;padding-bottom:4px\">{{ d }}<\u002Fdiv><\u002Fsc-for><div><\u002Fdiv><div><\u002Fdiv><sc-for list=\"{{ hp.dec }}\" as=\"d\" hint-placeholder-count=\"31\"><div style=\"height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:600 20px 'Barlow Condensed';{{ d.s }}\">{{ d.d }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{ hp.rooms }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div class=\"sec\" style=\"height:760px;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">3<\u002Fdiv>\n<div class=\"ph\" style=\"position:absolute;inset:0\">{{ r.photo }}<\u002Fdiv>\n<div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,18,16,.92) 0%,rgba(18,18,16,.45) 55%,rgba(18,18,16,.15))\"><\u002Fdiv>\n<div style=\"position:absolute;left:64px;bottom:72px;width:600px;display:grid;gap:18px\"><div class=\"eb\">Chapter {{ r.n }} · {{ r.note }}<\u002Fdiv><div style=\"font:400 72px/.95 'Archivo Black';color:rgb(246,239,228)\">{{ r.name }}<\u002Fdiv><p class=\"p\" style=\"font-size:18px\">{{ r.fits }}<\u002Fp><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><span class=\"chip\">Mic<\u002Fspan><span class=\"chip\">HDMI screens<\u002Fspan><span class=\"chip\">Holiday décor<\u002Fspan><span class=\"chip\">{{ r.tag }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"position:absolute;right:64px;bottom:72px;display:flex;gap:48px;text-align:right\"><div><div class=\"num\" style=\"font-size:128px\">{{ r.seat }}<\u002Fdiv><div class=\"unit\">Seated<\u002Fdiv><\u002Fdiv><div><div class=\"num\" style=\"font-size:128px;color:rgb(246,239,228)\">{{ r.stand }}<\u002Fdiv><div class=\"unit\">Standing<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fsc-for>\n<div class=\"sec cream\" style=\"padding:80px 64px;display:grid;grid-template-columns:1fr 1fr;gap:72px\"><div class=\"nb\">4<\u002Fdiv>\n<div style=\"display:grid;gap:18px;align-content:start\"><div class=\"eb\">Four rooms, properly decorated<\u002Fdiv><h2 class=\"h2\">The Rooms, Dressed for December<\u002Fh2><p class=\"p\">Hand-painted by artists from Mexico City, and from the foyer to the bar area the whole house is decorated for the holidays. Properly. Not a wreath on the door. Every room has a microphone and large TVs that take an HDMI cable. Bring your own décor, check with us on anything that attaches to a wall. Outside cake is $20, or let the dessert kitchen do it.<\u002Fp><div style=\"display:flex;gap:28px;margin-top:8px\"><div><div class=\"num\" style=\"font-size:64px;color:rgb(18,18,16)\">$200<\u002Fdiv><div class=\"unit\">Weekday rooms from, an hour<\u002Fdiv><\u002Fdiv><div><div class=\"num\" style=\"font-size:64px;color:rgb(18,18,16)\">12 to 134<\u002Fdiv><div class=\"unit\">Guests in one room<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div role=\"table\" style=\"display:grid;grid-template-columns:1.2fr auto auto 1.4fr;gap:0 24px;font:16px Barlow;align-self:start;align-items:center\"><div class=\"unit\" style=\"padding-bottom:12px;border-bottom:1px solid rgba(18,18,16,.3)\">Room<\u002Fdiv><div class=\"unit\" style=\"padding-bottom:12px;border-bottom:1px solid rgba(18,18,16,.3);text-align:right\">Seated<\u002Fdiv><div class=\"unit\" style=\"padding-bottom:12px;border-bottom:1px solid rgba(18,18,16,.3);text-align:right\">Standing<\u002Fdiv><div class=\"unit\" style=\"padding-bottom:12px;border-bottom:1px solid rgba(18,18,16,.3)\">Notes<\u002Fdiv><sc-for list=\"{{ hp.rooms }}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display:contents\"><div style=\"padding:16px 0;border-bottom:1px solid rgba(18,18,16,.12);font-weight:600;color:rgb(18,18,16)\">{{ r.name }}<\u002Fdiv><div style=\"padding:16px 0;border-bottom:1px solid rgba(18,18,16,.12);text-align:right;font:400 28px 'Archivo Black';color:rgb(18,18,16)\">{{ r.seat }}<\u002Fdiv><div style=\"padding:16px 0;border-bottom:1px solid rgba(18,18,16,.12);text-align:right;font:400 28px 'Archivo Black';color:rgba(18,18,16,.55)\">{{ r.stand }}<\u002Fdiv><div style=\"padding:16px 0;border-bottom:1px solid rgba(18,18,16,.12);color:rgba(18,18,16,.75)\">{{ r.note }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"display:grid;grid-template-columns:1fr 1fr;min-height:640px\"><div class=\"nb\">5<\u002Fdiv>\n<div class=\"ph\">PHOTO: Fajita buffet line, chicken and steak sizzling, tortillas, tight on the pans<\u002Fdiv>\n<div style=\"padding:80px 64px;display:grid;gap:20px;align-content:center\"><div class=\"eb\">What most companies order<\u002Fdiv><h2 class=\"h2\">The Fajita Buffet Is What Most Companies Pick<\u002Fh2><div style=\"display:flex;gap:40px;align-items:flex-end\"><div><div class=\"num\">$26<\u002Fdiv><div class=\"unit\">a person, fajita buffet<\u002Fdiv><\u002Fdiv><div><div class=\"num\" style=\"font-size:56px;color:rgb(246,239,228)\">$22<\u002Fdiv><div class=\"unit\">a person, printed handpicked menu<\u002Fdiv><\u002Fdiv><\u002Fdiv><p class=\"p\">Chicken and steak sizzling on the line, rice, beans, guacamole, tortillas pressed by hand that morning. People go back for thirds. We plan for that. Or a short menu printed for your group, so nobody stands in a line in a blazer. Dessert is made in house: churros, flan, tres leches.<\u002Fp><div style=\"display:flex;gap:12px\"><div class=\"gho\">The menu<\u002Fdiv><div class=\"gho\">Catering, if the party is at your office<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32);display:grid;grid-template-columns:1fr 520px;gap:72px;align-items:center\"><div class=\"nb\">6<\u002Fdiv>\n<div style=\"display:grid;gap:18px\"><div class=\"eb\">Poured by a bartender, every time<\u002Fdiv><h2 class=\"h2\">Drink Tickets, Set With Your Coordinator<\u002Fh2><p class=\"p\">You and Tomas decide what a ticket covers and how many each guest gets. Beyond the tickets, a cash bar. Upgrades: a dedicated bartender for your room, or a mini bar inside it. No self-serve alcohol stations, no margarita fountain. Your HR department will like that sentence.<\u002Fp><div style=\"display:flex;gap:8px\"><span class=\"chip\">Dedicated bartender<\u002Fspan><span class=\"chip\">Mini bar in the room<\u002Fspan><span class=\"chip\">Cash bar after tickets<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;border:1px dashed rgba(185,156,102,.6);border-radius:16px;overflow:hidden;background:rgb(28,27,24)\"><div style=\"padding:32px 28px;display:grid;gap:6px;flex:1\"><div class=\"eb\">Drink ticket · Admit one<\u002Fdiv><div style=\"font:400 40px/1 'Archivo Black';color:rgb(246,239,228)\">Margarita, beer or wine<\u002Fdiv><div class=\"unit\">Set with your coordinator<\u002Fdiv><\u002Fdiv><div style=\"width:120px;border-left:1px dashed rgba(185,156,102,.6);display:grid;place-items:center\"><div class=\"num\" style=\"font-size:56px\">2<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">7<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px\"><div style=\"display:grid;gap:14px\"><div class=\"eb\">The room comes with a DJ booth<\u002Fdiv><h2 class=\"h2\">Mariachi, a DJ, or Both<\u002Fh2><\u002Fdiv><div style=\"text-align:right\"><div class=\"num\" style=\"font-size:72px\">$499<\u002Fdiv><div class=\"unit\">DJ, karaoke and lighting upgrades from<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;height:360px\"><div class=\"card\" style=\"overflow:hidden;position:relative\"><div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO: Mariachi band playing between tables<\u002Fdiv><div style=\"position:absolute;left:24px;bottom:24px;right:24px\"><div class=\"eb\">One-hour minimum · ask when you book<\u002Fdiv><div style=\"font:400 28px 'Archivo Black';color:rgb(246,239,228)\">Mariachi<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"overflow:hidden;position:relative\"><div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO: DJ booth lit, bar area<\u002Fdiv><div style=\"position:absolute;left:24px;bottom:24px;right:24px\"><div class=\"eb\">Spanish and English<\u002Fdiv><div style=\"font:400 28px 'Archivo Black';color:rgb(246,239,228)\">DJ and hosts<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"card\" style=\"overflow:hidden;position:relative\"><div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO: Karaoke, guest singing, lights<\u002Fdiv><div style=\"position:absolute;left:24px;bottom:24px;right:24px\"><div class=\"eb\">In your own room<\u002Fdiv><div style=\"font:400 28px 'Archivo Black';color:rgb(246,239,228)\">Karaoke and lighting<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">8<\u002Fdiv>\n<div style=\"display:grid;gap:14px;margin-bottom:40px\"><div class=\"eb\">Invoiced, not improvised<\u002Fdiv><h2 class=\"h2\">How Booking Works for a Company<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative\"><div style=\"position:absolute;left:0;right:0;top:34px;border-top:1px solid rgba(185,156,102,.4)\"><\u002Fdiv><sc-for list=\"{{ hp.steps }}\" as=\"s\" hint-placeholder-count=\"4\"><div style=\"padding-right:32px;position:relative\"><div style=\"width:68px;height:68px;border-radius:50%;background:rgb(18,18,16);border:1px solid rgb(214,188,133);display:grid;place-items:center;font:400 28px 'Archivo Black';color:rgb(214,188,133);margin-bottom:20px\">{{ s.n }}<\u002Fdiv><div style=\"font:400 24px 'Archivo Black';color:rgb(246,239,228);margin-bottom:8px\">{{ s.t }}<\u002Fdiv><p class=\"p\" style=\"font-size:16px\">{{ s.d }}<\u002Fp><div class=\"eb\" style=\"margin-top:12px;color:rgb(246,239,228)\">{{ s.k }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<p class=\"p\" style=\"margin-top:32px;color:rgb(214,188,133)\">We work with tax-exempt groups. Tell Tomas when you book.<\u002Fp><\u002Fdiv>\n<div class=\"sec\" style=\"display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">9<\u002Fdiv>\n<div style=\"padding:80px 64px;display:grid;gap:22px;align-content:center\"><div class=\"eb\">Who has held theirs here<\u002Fdiv><h2 class=\"h2\" style=\"font-size:36px\">Office Teams, Family Parties, and the Ones Who Come Back Every December<\u002Fh2><div style=\"font:400 26px/1.35 Barlow;color:rgb(246,239,228)\">\"I had a party of 25 last Friday and the service from Jonathan and the manager Tomas was phenomenal! They walked me through all of the steps and executed it perfectly.\"<\u002Fdiv><div class=\"eb\" style=\"color:rgba(234,226,214,.7)\">Sian R., Google review<\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:14px;margin-top:8px\"><div class=\"num\" style=\"font-size:56px\">4.6<\u002Fdiv><div style=\"color:rgb(214,188,133);font-size:22px;letter-spacing:2px\">★★★★★<\u002Fdiv><div class=\"unit\">across over 5,600 Google reviews<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"ph\" style=\"min-height:520px\">PHOTO: Company group of about 25 at a long table, International Room, candid<\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" id=\"gift-box\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32);display:grid;grid-template-columns:420px 1fr;gap:64px;align-items:center\"><div class=\"nb\">10<\u002Fdiv>\n<div class=\"ph\" style=\"height:420px;border-radius:16px\">PHOTO: Sealed holiday gift box on the table, gold ribbon, top down<\u002Fdiv>\n<div style=\"display:grid;gap:18px\"><div class=\"eb\">Black Friday through December 31<\u002Fdiv><h2 class=\"h2\">The Holiday Gift Box<\u002Fh2><p class=\"p\">Every visit from November 27 through December 31 sends you home with a sealed holiday box. Do not open it. Bring it back between January 1 and February 13 and we open it at the table. Inside: free margaritas, free entrées, free appetizers, a free Avion shooter, free dessert, and one box in the stack holding a $500 gift certificate. A holiday party is a lot of visits at once. The boxes come with them.<\u002Fp><div style=\"font:12px/1.5 Barlow;color:rgba(234,226,214,.5)\">Boxes must be returned unopened Jan 1 to Feb 13. One box per table, per check, parties of 1 to 50. Cannot be combined with other offers. No cash value. Señor Tequila's may cancel, void or change the offer at any time.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32);display:grid;grid-template-columns:380px 1fr;gap:64px\"><div class=\"nb\">11<\u002Fdiv>\n<div style=\"display:grid;gap:16px;align-content:start\"><div class=\"eb\">Seven questions<\u002Fdiv><h2 class=\"h2\">Holiday Party Questions, Answered<\u002Fh2><div class=\"gho\" style=\"width:max-content\">Call 301-569-4574<\u002Fdiv><\u002Fdiv>\n<div><sc-for list=\"{{ hp.faqs }}\" as=\"f\" hint-placeholder-count=\"7\"><div style=\"border-top:1px solid rgb(42,40,32);padding:22px 0;display:grid;grid-template-columns:1fr 32px;gap:16px\"><div><div style=\"font:600 19px Barlow;color:rgb(246,239,228)\">{{ f.q }}<\u002Fdiv><p class=\"p\" style=\"font-size:16px;margin-top:10px;color:rgba(234,226,214,.7)\">{{ f.a }}<\u002Fp><\u002Fdiv><div style=\"width:32px;height:32px;border-radius:50%;border:1px solid rgba(214,188,133,.6);display:grid;place-items:center;color:rgb(214,188,133)\">−<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"min-height:760px;display:grid;grid-template-columns:1fr 560px;gap:64px;padding:80px 64px;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">12<\u002Fdiv>\n<div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO: Tomas in the International Room doorway, lights on, inviting<\u002Fdiv><div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,18,16,.2),rgba(18,18,16,.95) 60%)\"><\u002Fdiv>\n<div style=\"position:relative;display:grid;gap:18px;align-content:end\"><div class=\"eb\">Start here<\u002Fdiv><h2 class=\"h2\" style=\"font-size:52px;color: the ghost.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<!-- ===================== 2a THE COUNTDOWN ===================== -->\n<div class=\"dv-opt\" id=\"2a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>The Countdown<\u002Fdiv>\n<div style=\"display:flex;gap:28px;align-items:flex-start\">\n<div class=\"dv-card art\">\n<div class=\"pv\">Preview for Señor Tequila's review. This page is not published yet.<\u002Fdiv>\n<div class=\"nav\"><div class=\"hdr\"><div class=\"logo\"><\u002Fdiv><div class=\"brand\">SEÑOR TEQUILA'S<\u002Fdiv><\u002Fdiv><div class=\"navl\"><sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"9\"><div>{{ n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div style=\"display:flex;gap:10px\"><div class=\"gho\" style=\"height:40px;padding:0 18px\">Reserve<\u002Fdiv><div class=\"btn\" style=\"height:40px;padding:0 18px;box-shadow:none\">Order<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"height:1000px\"><div class=\"nb\">1<\u002Fdiv>\n<div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO or VIDEO: Bar area at night, DJ booth, smoke machine, crowd under lights<\u002Fdiv><div style=\"position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(18,18,16,.3),rgba(18,18,16,.95) 70%)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:48px 64px;border:1px solid rgba(185,156,102,.5)\"><\u002Fdiv><div style=\"position:absolute;inset:56px 72px;border:1px solid rgba(185,156,102,.25)\"><\u002Fdiv>\n<div style=\"position:absolute;inset:0;display:grid;align-content:center;justify-items:center;text-align:center;gap:20px;padding:0 120px\">\n<div class=\"eb\" style=\"font-size:14px\">Thursday, December 31 · Germantown, MD · 3 PM to 2 AM<\u002Fdiv>\n<div style=\"display:flex;gap:40px;align-items:baseline\"><div><div class=\"num\" style=\"font-size:200px;letter-spacing:-.02em\">67<\u002Fdiv><div class=\"unit\">Days<\u002Fdiv><\u002Fdiv><div class=\"num\" style=\"font-size:120px;color:rgba(214,188,133,.4)\">:<\u002Fdiv><div><div class=\"num\" style=\"font-size:200px;letter-spacing:-.02em\">14<\u002Fdiv><div class=\"unit\">Hours<\u002Fdiv><\u002Fdiv><div class=\"num\" style=\"font-size:120px;color:rgba(214,188,133,.4)\">:<\u002Fdiv><div><div class=\"num\" style=\"font-size:200px;letter-spacing:-.02em\">22<\u002Fdiv><div class=\"unit\">Minutes<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"unit\" style=\"color:rgb(214,188,133)\">until the masks go on · 9 PM<\u002Fdiv>\n<h1 class=\"h1\" style=\"font-size:56px;max-width:1000px;margin-top:12px\">New Year's Eve Dinner and Masquerade Party in Germantown, MD<\u002Fh1>\n<div style=\"display:flex;gap:28px;border-top:1px solid rgba(185,156,102,.5);border-bottom:1px solid rgba(185,156,102,.5);padding:14px 32px\" class=\"eb\"><span>Dinner · full menu · all ages<\u002Fspan><span>9 PM · masquerade · bar area 21+<\u002Fspan><span>$5 cover at the door<\u002Fspan><span>DJs · Spanish and English<\u002Fspan><span>Midnight · champagne toast on us<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;margin-top:12px\"><div class=\"btn\">Reserve a Table<\u002Fdiv><div class=\"gho\">Book a Private Room<\u002Fdiv><div class=\"gho\">Call 301-569-4574<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px\"><div class=\"nb\">2<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:end;margin-bottom:48px\"><div style=\"display:grid;gap:14px\"><div class=\"eb\">Two parties in one building<\u002Fdiv><h2 class=\"h2\" style=\"font-size:64px\">How the Night Runs<\u002Fh2><\u002Fdiv><p class=\"p\">Early, it is a restaurant with a very good dinner and your whole family at the table. Late, the bar area is a masquerade. Same building, same kitchen, different volume.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:16px\"><sc-for list=\"{{ ny.tl }}\" as=\"t\" hint-placeholder-count=\"5\"><div class=\"card\" style=\"padding:28px;display:grid;gap:12px;align-content:start;min-height:300px;{{ t.cs }}\"><div class=\"num\" style=\"font-size:56px\">{{ t.t }}<\u002Fdiv><div style=\"font:400 22px 'Archivo Black';color:rgb(246,239,228)\">{{ t.h }}<\u002Fdiv><p class=\"p\" style=\"font-size:15px\">{{ t.d }}<\u002Fp><div class=\"eb\" style=\"margin-top:auto;color:rgba(234,226,214,.6)\">{{ t.k }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<p class=\"te\" style=\"margin:24px 0 0;text-align:center\">Masks: we hand out a limited number at the door while they last. Bring your own to be sure of one.<\u002Fp><\u002Fdiv>\n<div class=\"sec cream\" style=\"display:grid;grid-template-columns:1fr 1fr\"><div class=\"nb\">3<\u002Fdiv>\n<div style=\"padding:96px 64px;display:grid;gap:22px;align-content:center\"><div class=\"eb\">No prix fixe. No three choices.<\u002Fdiv><h2 class=\"h2\" style=\"font-size:56px\">Dinner First, Off the Full Menu<\u002Fh2><p class=\"p\" style=\"font-size:18px\">Most New Year's Eve dinners come with a set menu and a chicken-or-fish decision made for you in October. Ours is the full menu, the same as any Thursday. Molcajetes still bubbling in stone. Quesabirria. Fajitas. Tortillas pressed by hand that morning. The Birria Ramen, if you want to start the year full.<\u002Fp><p class=\"p\">No drink specials that night, and we would rather tell you than pretend. The margaritas are the margaritas: 14 ounces, 18 ounces, or the 54-ounce Big Mami.<\u002Fp><div style=\"display:flex;gap:12px;flex-wrap:wrap\"><div class=\"btn\">Reserve a Table · Toast Tables, under 20<\u002Fdiv><div class=\"gho\">20 or more, call 301-569-4574<\u002Fdiv><\u002Fdiv><div class=\"unit\">Reservations are for the dining rooms. The bar area is first come, first served, and it fills before 9.<\u002Fdiv><\u002Fdiv>\n<div class=\"ph\" style=\"min-height:720px\">PHOTO: Molcajete arriving at the table, bubbling, family around it<\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;display:grid;grid-template-columns:1fr 560px;gap:64px;align-items:center\"><div class=\"nb\">4<\u002Fdiv>\n<div class=\"ph\" style=\"position:absolute;inset:0\">PHOTO: International Room with lighting rig on, party set<\u002Fdiv><div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,18,16,.3),rgba(18,18,16,.97) 55%)\"><\u002Fdiv>\n<div style=\"position:relative;display:grid;gap:18px\"><div class=\"eb\">Your own countdown<\u002Fdiv><h2 class=\"h2\">Your Own Room for the Countdown<\u002Fh2><p class=\"p\">A room that seats 48 to 112 with its own sound and lighting from the DJ booth, a microphone and a large HDMI screen, your playlist or our DJ, and the kitchen on your side of the wall. Groups from 12. Holiday rates apply, and Tomas quotes them when you call. He replies within 24 hours with a formal invoice and a secure payment link. The deposit is the room fee.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"position:relative;padding:32px;display:grid;gap:12px\"><div style=\"font:400 24px 'Archivo Black';color:rgb(246,239,228)\">Ask about a room<\u002Fdiv><div class=\"fld\">Name<\u002Fdiv><div class=\"fld\">Phone<\u002Fdiv><div class=\"fld\">Email<\u002Fdiv><div class=\"fld\">Guest count<\u002Fdiv><div class=\"fld\" style=\"height:100px;align-items:flex-start;padding-top:14px\">Tell us about the night<\u002Fdiv><div class=\"btn\">Book a Private Room<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">5<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:420px 1fr;gap:64px;align-items:start\"><div style=\"display:grid;gap:14px\"><div class=\"eb\">NYE and the days around it<\u002Fdiv><h2 class=\"h2\">Christmas Week Hours<\u002Fh2><p class=\"p\">Pozole on New Year's Day is a tradition in a lot of Mexican houses. Tamales, pozole, birria and handmade tortillas all go home with you. Order ahead through catering with 48 hours notice, or grab them with takeout earlier in the week.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\"><sc-for list=\"{{ ny.hours }}\" as=\"h\" hint-placeholder-count=\"3\"><div class=\"card\" style=\"padding:28px;display:grid;gap:8px\"><div class=\"eb\">{{ h.d }}<\u002Fdiv><div class=\"num\" style=\"font-size:48px;{{ h.s }}\">{{ h.t }}<\u002Fdiv><div class=\"unit\">{{ h.n }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"margin:0 64px 80px;padding:40px;border:1px solid rgba(185,156,102,.5);border-radius:16px;display:grid;grid-template-columns:200px 1fr auto;gap:40px;align-items:center;background:rgb(28,27,24)\"><div class=\"nb\">6<\u002Fdiv>\n<div class=\"ph\" style=\"height:160px;border-radius:12px\">PHOTO: Sealed gift box<\u002Fdiv><div><div class=\"eb\">Your NYE visit counts · last night of the offer<\u002Fdiv><h2 class=\"h2\" style=\"font-size:32px;margin:8px 0\">The Holiday Gift Box<\u002Fh2><p class=\"p\" style=\"font-size:15px\">New Year's Eve is the last night of the Holiday Gift Box. Every visit Nov 27 to Dec 31 sends you home with a sealed box. Bring it back unopened Jan 1 to Feb 13 and we open it at your table. So you already have a reason to come back on New Year's Day. We open at 3.<\u002Fp><\u002Fdiv><div class=\"gho\">The Gift Box →<\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:0 64px 80px;text-align:center\"><div class=\"nb\">7<\u002Fdiv>\n<div class=\"eb\">Over 5,600 reviews<\u002Fdiv><div style=\"font:400 48px/1.1 'Archivo Black';color:rgb(246,239,228);max-width:1100px;margin:24px auto\">\"What an absolutely amazing, electric place! The music, the dim lighting, and the perfectly used smoke machine make for a great atmosphere!\"<\u002Fdiv><div style=\"display:flex;justify-content:center;gap:40px;align-items:center\"><div class=\"eb\" style=\"color:rgba(234,226,214,.7)\">Joe T., Google review<\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:12px\"><div class=\"num\" style=\"font-size:48px\">4.6<\u
