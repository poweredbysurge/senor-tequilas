bottom:40px\"><sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"9\"><div>{{ n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div class=\"ftb\"><div>20021 Century Blvd, Germantown, MD 20874 · 301-569-4574<\u002Fdiv><div>Dec 24 and 25 closed · Dec 31 3 PM to 2 AM · Jan 1 from 3 PM<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:340px;flex:none;display:grid;gap:4px;font:13px/1.45 system-ui,sans-serif\">\n<div style=\"font:600 18px system-ui;color:#1a1a1a\">The Countdown<\u002Fdiv>\n<div style=\"color:#444;margin-bottom:10px\">For the group deciding where to go out. A flyer you could pin to a wall: the masquerade is the headline act, the clock makes it urgent, dinner is the easy way in.<\u002Fdiv>\n<div class=\"note\"><b>1<\u002Fb><div>Poster hero: double gold frame, live countdown to 9 PM Dec 31 at 200px, facts rule, three CTAs. <i>Digits flip per minute, smoke video loops behind.<\u002Fi><\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>2<\u002Fb><div>The night as five flyer cards, 9 PM card lifted gold. Special Elite for the mask line (the page's one typewriter moment).<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>3<\u002Fb><div>Cream section: dinner. The light half of the night gets the light field. Molcajete photo full height.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>4<\u002Fb><div>Private room: dimmed room photo, form card right.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>5<\u002Fb><div>Christmas week hours: three numeral tiles, closed dates struck.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>6<\u002Fb><div>Gift box banner linking to /holiday-parties/#gift-box.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>7<\u002Fb><div>Proof: centered pull quote, rating line.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>8<\u002Fb><div>FAQ accordion, heading sticky. <i>One open at a time.<\u002Fi><\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>9<\u002Fb><div>Close: dark photo field, centered, same three CTAs as the hero.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<!-- ===================== 3c PAINTED SIGN ===================== -->\n<div class=\"dv-opt\" id=\"3c\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3c\">3c<\u002Fa>Painted Sign<\u002Fdiv>\n<div style=\"display:flex;gap:28px;align-items:flex-start\">\n<div class=\"dv-card art\">\n<div class=\"pv\">Preview for Señor Tequila's review. This page is not published yet.<\u002Fdiv>\n<div class=\"nav\"><div class=\"hdr\"><div class=\"logo\"><\u002Fdiv><div class=\"brand\">SEÑOR TEQUILA'S<\u002Fdiv><\u002Fdiv><div class=\"navl\"><sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"9\"><div>{{ n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div style=\"display:flex;gap:10px\"><div class=\"gho\" style=\"height:40px;padding:0 18px\">Reserve<\u002Fdiv><div class=\"btn\" style=\"height:40px;padding:0 18px;box-shadow:none\">Order<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:48px 64px 64px;background:rgb(20,18,16)\"><div class=\"nb\">1<\u002Fdiv>\n<div class=\"sign\" style=\"padding:56px 64px;display:grid;grid-template-columns:1fr 520px;gap:48px;align-items:center;position:relative\">\n<div style=\"position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:rgb(20,18,16);padding:0 20px;white-space:nowrap\" class=\"eb\">★ Since 2021 · Germantown, Maryland ★<\u002Fdiv>\n<div style=\"display:grid;gap:12px\"><div class=\"eb\" style=\"font-size:16px;text-align:center;letter-spacing:.3em\">The one that makes people take a photo first<\u002Fdiv><h1 class=\"h1\" style=\"font-size:168px;line-height:.85;text-align:center;letter-spacing:-.02em\">BIRRIA<br><span style=\"color:rgb(214,188,133)\">RAMEN<\u002Fspan><\u002Fh1><div style=\"display:flex;justify-content:center;gap:0;align-items:center;margin-top:8px\"><div style=\"flex:1;border-top:1px solid rgba(185,156,102,.6)\"><\u002Fdiv><div class=\"unit\" style=\"padding:0 20px;font-size:14px;color:rgb(246,239,228)\">Beef braised 8 hours · Japanese noodles · Consommé<\u002Fdiv><div style=\"flex:1;border-top:1px solid rgba(185,156,102,.6)\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;justify-content:center;gap:12px;margin-top:16px\"><div class=\"btn\" style=\"height:60px;padding:0 36px;font-size:16px\">Order Takeout<\u002Fdiv><div class=\"gho\" style=\"height:60px;padding:0 36px;font-size:16px\">See the Menu<\u002Fdiv><div class=\"gho\" style=\"height:60px;padding:0 36px;font-size:16px\">Call 301-569-4574<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"position:relative\"><div class=\"ph\" style=\"height:520px;border-radius:16px\">PHOTO: The bowl, 3/4 angle, steam, chopsticks<\u002Fdiv><div style=\"position:absolute;right:-24px;top:-24px;width:200px;height:200px;border-radius:50%;background:rgb(214,188,133);display:grid;place-items:center;text-align:center;color:rgb(18,18,16);transform:rotate(8deg)\"><div><div style=\"font:400 72px/1 'Archivo Black'\">$21<\u002Fdiv><div style=\"font:600 12px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase\">a full meal<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:0 64px 80px;background:rgb(20,18,16);display:grid;grid-template-columns:repeat(4,1fr);gap:16px\"><div class=\"nb\">2<\u002Fdiv>\n<sc-for list=\"{{ br.tiles }}\" as=\"t\" hint-placeholder-count=\"4\"><div style=\"border:2px solid rgb(214,188,133);border-radius:16px;padding:28px;display:grid;gap:8px;text-align:center;justify-items:center\"><div class=\"num\" style=\"font-size:72px\">{{ t.n }}<\u002Fdiv><div style=\"font:400 20px 'Archivo Black';color:rgb(246,239,228)\">{{ t.t }}<\u002Fdiv><div class=\"unit\">{{ t.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;border-top:1px solid rgb(42,40,32)\"><div class=\"nb\">3<\u002Fdiv>\n<div class=\"ph\" style=\"height:560px;border-radius:16px\">PHOTO: The bowl, top down, tight<\u002Fdiv>\n<div style=\"display:grid;gap:22px\"><div class=\"eb\">What is in it<\u002Fdiv><h2 class=\"h2\" style=\"font-size:56px\">What Is in the Bowl<\u002Fh2><div style=\"display:grid;gap:0\"><sc-for list=\"{{ br.parts }}\" as=\"c\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px dashed rgba(185,156,102,.5)\"><div class=\"num\" style=\"font-size:22px\">{{ c.n }}<\u002Fdiv><div style=\"font:400 24px 'Archivo Black';color:rgb(246,239,228)\">{{ c.t }}<\u002Fdiv><div class=\"unit\">{{ c.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><p class=\"p\">A full meal for one. \"You will not be hungry afterwards.\" Noodles are wheat.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;border-top:1px solid rgb(42,40,32);text-align:center\"><div class=\"nb\">4<\u002Fdiv>\n<div class=\"eb\">Eight hours before it meets a noodle<\u002Fdiv><h2 class=\"h2\" style=\"font-size:56px;margin:14px 0 36px\">How the Birria Is Made<\u002Fh2>\n<div style=\"display:flex;justify-content:center;gap:20px;align-items:center;flex-wrap:wrap\"><sc-for list=\"{{ br.spices }}\" as=\"s\" hint-placeholder-count=\"5\"><div style=\"display:flex;align-items:center;gap:20px\"><div style=\"font:400 40px 'Archivo Black';color:rgb(246,239,228)\">{{ s }}<\u002Fdiv><div style=\"color:rgb(214,188,133);font-size:20px\">✦<\u002Fdiv><\u002Fdiv><\u002Fsc-for><div style=\"font:400 40px 'Archivo Black';color:rgba(234,226,214,.4)\">and the rest they will not type out<\u002Fdiv><\u002Fdiv>\n<p class=\"p\" style=\"max-width:800px;margin:32px auto 0\">The meat falls apart. The liquid it cooked in becomes the consommé, the same red broth you dip a quesabirria taco into, except here the noodles soak it up for you. If you know our birria tacos, this is the same braise in a different shape.<\u002Fp>\n<div class=\"ph\" style=\"height:360px;border-radius:16px;margin-top:40px\">PHOTO: The braise pot, ladle lifting consommé, red and glossy, wide<\u002Fdiv><\u002Fdiv>\n<div class=\"sec cream\" style=\"padding:80px 64px\"><div class=\"nb\">5<\u002Fdiv>\n<div class=\"sign\" style=\"border-color:rgb(18,18,16);outline-color:rgb(18,18,16);padding:48px 64px;display:grid;grid-template-columns:1fr 1fr;gap:64px;position:relative\"><div style=\"position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:rgb(246,239,228);padding:0 20px;white-space:nowrap\" class=\"eb\">Cold and carbonated<\u002Fdiv>\n<div style=\"display:grid;gap:14px\"><h2 class=\"h2\" style=\"font-size:48px\">What to Drink With It<\u002Fh2><p class=\"p\">Roberto's rule is anything cold and carbonated, because the bowl is rich and the bubbles reset your mouth between bites. Not on the happy hour menu: it is a $21 dinner, not a $7 snack. The happy hour drinks are, 3 to 6, Monday to Friday, in the bar area.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;gap:0;align-content:center\"><sc-for list=\"{{ br.drinks }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px dashed rgba(18,18,16,.4)\"><div style=\"font:400 32px 'Archivo Black';color:rgb(18,18,16)\">{{ d.t }}<\u002Fdiv><div class=\"unit\">{{ d.n }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;display:grid;grid-template-columns:1fr 1fr;gap:16px\"><div class=\"nb\">6<\u002Fdiv>\n<div style=\"border:2px solid rgb(214,188,133);border-radius:16px;padding:40px;display:grid;gap:16px;text-align:center;justify-items:center\"><div class=\"eb\">It travels<\u002Fdiv><h2 class=\"h2\" style=\"font-size:56px\">Order It In<\u002Fh2><p class=\"p\" style=\"max-width:460px\">The consommé goes in its own container and the noodles do not sit in it until you say so. Pickup through Toast up to 15 minutes before close. DoorDash, Uber Eats, Grubhub.<\u002Fp><div class=\"btn\" style=\"height:60px;padding:0 36px;font-size:16px\">Order on Toast<\u002Fdiv><div style=\"display:flex;gap:8px\"><span class=\"chip\">DoorDash<\u002Fspan><span class=\"chip\">Uber Eats<\u002Fspan><span class=\"chip\">Grubhub<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"border:2px solid rgb(214,188,133);border-radius:16px;padding:40px;display:grid;gap:16px;text-align:center;justify-items:center\"><div class=\"eb\">Or come in<\u002Fdiv><h2 class=\"h2\" style=\"font-size:56px\">Next to Topgolf<\u002Fh2><p class=\"p\" style=\"max-width:460px\">20021 Century Blvd, Germantown. Free parking at the door. Ten minutes from Gaithersburg and Montgomery Village. Mon to Fri from 3 PM, Sat and Sun from 11 AM.<\u002Fp><div class=\"gho\" style=\"height:60px;padding:0 36px;font-size:16px\">Call 301-569-4574<\u002Fdiv><div class=\"ph\" style=\"height:120px;width:100%;border-radius:12px\">MAP: pin<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:0 64px 80px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center\"><div class=\"nb\">7<\u002Fdiv>\n<div class=\"ph\" style=\"height:320px;border-radius:16px\">PHOTO: Alex and Roberto Rivas, kitchen, 2020 snapshot or today<\u002Fdiv>\n<div style=\"display:grid;gap:14px\"><div class=\"eb\">2020<\u002Fdiv><h2 class=\"h2\" style=\"font-size:36px\">Fifteen Recipes and the Trunk of a Car<\u002Fh2><p class=\"p\">During the 2020 lockdown Alex Rivas cooked birria at home and left batches with handmade tortillas on the trunk of his brother Roberto's car every two days. About fifteen recipes later, one was the one. On the menu since 2021, a top ten seller since.<\u002Fp><p class=\"te\">\"After about fifteen recipes, this one was chosen, then perfected.\" Roberto Rivas<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:0 64px 80px;text-align:center\"><div class=\"nb\">8<\u002Fdiv>\n<div style=\"border-top:1px solid rgba(185,156,102,.5);border-bottom:1px solid rgba(185,156,102,.5);padding:40px;display:flex;justify-content:center;gap:48px;align-items:center\"><div class=\"num\" style=\"font-size:72px\">4.6<\u002Fdiv><div style=\"font:400 24px/1.3 Barlow;color:rgb(246,239,228);max-width:640px;text-align:left\">\"Easiest decision, we're coming back! The Birria Ramen is amazing.\" <span class=\"eb\" style=\"color:rgba(234,226,214,.7)\">Matt P., Google review<\u002Fspan><\u002Fdiv><div class=\"unit\">5,600+ Google reviews<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:0 64px 80px\"><div class=\"nb\">9<\u002Fdiv>\n<h2 class=\"h2\" style=\"margin-bottom:28px;text-align:center\">Birria Ramen, Answered<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px 48px\"><sc-for list=\"{{ br.faqs }}\" as=\"f\" hint-placeholder-count=\"7\"><div class=\"card\" style=\"padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center\"><div style=\"font:600 17px Barlow;color:rgb(246,239,228)\">{{ f.q }}<\u002Fdiv><div style=\"color:rgb(214,188,133);font-size:20px\">+<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div class=\"sec\" style=\"padding:80px 64px;background:rgb(20,18,16)\"><div class=\"nb\">10<\u002Fdiv>\n<div class=\"sign\" style=\"padding:64px;display:grid;justify-items:center;text-align:center;gap:18px\"><h2 class=\"h2\" style=\"font-size:168px;line-height:.85;color:rgb(246,239,228)\">COME<br><span style=\"color:rgb(214,188,133)\">HUNGRY<\u002Fspan><\u002Fh2><p class=\"p\" style=\"font-size:19px\">One bowl, eight hours of work, $21. Dine in, pick it up, or have it brought to you.<\u002Fp><div style=\"display:flex;gap:12px\"><div class=\"btn\" style=\"height:60px;padding:0 36px;font-size:16px\">Order Takeout<\u002Fdiv><div class=\"gho\" style=\"height:60px;padding:0 36px;font-size:16px\">See the Menu<\u002Fdiv><div class=\"gho\" style=\"height:60px;padding:0 36px;font-size:16px\">Call 301-569-4574<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"foot\"><div class=\"eb\">Señor Tequila's<\u002Fdiv><div class=\"ftt\">FROM MEXICO, <span style=\"color:rgb(214,188,133)\">WITH LOVE.<\u002Fspan><\u002Fdiv><div class=\"navl\" style=\"justify-content:center;flex-wrap:wrap;margin-bottom:40px\"><sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"9\"><div>{{ n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><div class=\"ftb\"><div>20021 Century Blvd, Germantown, MD 20874 · 301-569-4574<\u002Fdiv><div>Mon to Fri from 3 PM · Sat and Sun from 11 AM<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:340px;flex:none;display:grid;gap:4px;font:13px/1.45 system-ui,sans-serif\">\n<div style=\"font:600 18px system-ui;color:#1a1a1a\">Painted Sign<\u002Fdiv>\n<div style=\"color:#444;margin-bottom:10px\">For the person who already wants it and is deciding between dine-in and Toast. A hand-painted-sign poster: double-rule frames, dashed menu-board rules, a price badge. Sells by being unmistakable and order-first.<\u002Fdiv>\n<div class=\"note\"><b>1<\u002Fb><div>Hero: sign frame (3px gold rule plus a hairline outline), BIRRIA RAMEN at 168px, $21 price badge rotated 8 degrees, three oversized buttons. <i>Badge rocks once on load.<\u002Fi> Lettering is Archivo Black, original composition.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>2<\u002Fb><div>Four fact tiles: 8 HRS, MILD, $21, 2021. The quick facts before any paragraph.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>3<\u002Fb><div>What is in the bowl as a dashed menu board, six numbered lines beside the top-down photo.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>4<\u002Fb><div>Braise: spice list set as a centered word chain with gold stars, pot photo below.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>5<\u002Fb><div>Cream section: drinks as a menu board inside a dark-ruled sign frame.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>6<\u002Fb><div>Two sign panels: Order It In (Toast, green) and Next to Topgolf (call, map).<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>7<\u002Fb><div>Story compressed to one row, Special Elite quote.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>8<\u002Fb><div>Proof as a ruled band.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>9<\u002Fb><div>FAQ card accordion in two columns.<\u002Fdiv><\u002Fdiv>\n<div class=\"note\"><b>10<\u002Fb><div>Close: COME HUNGRY at 168px in the same sign frame as the hero, bookending the page.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"shots\" style=\"width:1100px\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#shots\">shots<\u002Fa>Shot list, all three pages<\u002Fdiv><div class=\"dv-card\" style=\"padding:20px 24px\"><div class=\"sl\" style=\"display:grid;grid-template-columns:150px 170px 1fr 240px\"><div style=\"font-weight:600;padding:8px 12px 8px 0\">Page<\u002Fdiv><div style=\"font-weight:600;padding:8px 12px 8px 0\">Section<\u002Fdiv><div style=\"font-weight:600;padding:8px 12px 8px 0\">What the photo shows<\u002Fdiv><div style=\"font-weight:600;padding:8px 12px 8px 0\">Crop<\u002Fdiv><sc-for list=\"{{ shots }}\" as=\"s\" hint-placeholder-count=\"20\"><div style=\"display:contents\"><div style=\"padding:8px 12px 8px 0;border-top:1px solid rgba(0,0,0,.1)\">{{ s.c }}<\u002Fdiv><div style=\"padding:8px 12px 8px 0;border-top:1px solid rgba(0,0,0,.1)\">{{ s.sec }}<\u002Fdiv><div style=\"padding:8px 12px 8px 0;border-top:1px solid rgba(0,0,0,.1)\">{{ s.what }}<\u002Fdiv><div style=\"padding:8px 12px 8px 0;border-top:1px solid rgba(0,0,0,.1)\">{{ s.crop }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  hp() {\n    const nav = ['Our Story','Menu','Takeout','Tacos','Happy Hour','Private Events','Catering','Game Day','Contact'];\n    const fit = (seat) => seat >= 40 ? ['Fits', 'border-color:rgb(214,188,133);background:rgb(35,33,28)'] : ['Too small', 'opacity:.45'];\n    const rooms = [\n      {n:'01',name:'Mexican Room',seat:112,stand:134,note:'Main dining room',tag:'Two screens',fits:'The whole company at long tables, a head table under the mural, the year-in-review on two screens.',photo:'PHOTO: Mexican Room set for a party, long tables, holiday décor, wide'},\n      {n:'02',name:'International Room',seat:96,stand:115,note:'Where most private events happen',tag:'Most booked',fits:'The room most companies take. A long head table, a dance floor if you want one, the door closes.',photo:'PHOTO: International Room set for a company dinner, wide'},\n      {n:'03',name:'Indoor Patio',seat:48,stand:58,note:'Roofed, enclosed, warm in December',tag:'Year-round',fits:'Teams of 20 to 50, a family dinner that outgrew the house. Enclosed, heated, plants and string lights.',photo:'PHOTO: Indoor Patio at night, string lights, warm, wide'},\n      {n:'04',name:'Bar Area',seat:108,stand:150,note:'The DJ booth lives here',tag:'DJ booth',fits:'The standing party. Two long tables, a 20-seat counter, and the DJ booth already in the room.',photo:'PHOTO: Bar Area with DJ booth lit, crowd, wide'}\n    ].map(r => { const f = fit(r.seat); return {...r, fitLabel:f[0], fitStyle:f[1]}; });\n    const steps = [\n      {n:'1',t:'Reach Tomas',d:'Call 301-569-4574 or send the form. He replies within 24 hours.',k:'24 hrs'},\n      {n:'2',t:'Meet, or walk the room',d:'Fifteen minutes. Bring whoever signs off. Date, headcount, menu, tickets.',k:'15 min'},\n      {n:'3',t:'Get a formal invoice',d:'Through our catering and private parties system. Pay in person or by secure link.',k:'Invoice'},\n      {n:'4',t:'Hold the date',d:'The deposit is the room fee, refundable up to 48 hours before the party.',k:'Refundable to 48 hrs'}\n    ];\n    const faqs = [\n      {q:'How many people can a holiday party be at Señor Tequila\\u2019s?',a:'From 12 to 134 in a single room. The Mexican Room seats 112 or holds 134 standing, the International Room 96 or 115, the Indoor Patio 48 or 58. The whole house runs to about 400.'},\n      {q:'What does a company holiday party cost?',a:'The fajita buffet starts at $26 a person. Other menus from $22. Weekday rooms from $200 an hour, weekend fees quoted by date. DJ, karaoke and lighting upgrades from $499. Every quote is a formal invoice.'},\n      {q:'Can we hold a holiday party on a weekday or at lunch?',a:'Yes, and it is the best value in December. Monday to Friday we do not open to the public until 3 PM, so a lunch party has the whole restaurant to itself.'},\n      {q:'Is there a screen and a microphone for speeches or a slideshow?',a:'Every room has a microphone and large TVs that connect over HDMI. Bring a laptop and the cable, or ask Tomas ahead of time.'},\n      {q:'How do drinks work? Open bar, drink tickets, or cash bar?',a:'Drink tickets or a cash bar, set with your coordinator. A dedicated bartender or a mini bar in your room are upgrades. No self-serve alcohol stations.'},\n      {q:'Can you invoice our company?',a:'Yes. After a short meeting we send a formal invoice. The deposit is the room fee, refundable up to 48 hours before. We work with tax-exempt groups.'},\n      {q:'Which December dates are unavailable for holiday parties?',a:'December 24 and 25 only. We are also closed Thanksgiving Day. Fridays and Saturdays book first.'}\n    ].map((f,i) => ({...f, n: String(i+1).padStart(2,'0')}));\n    const ents = [\n      {t:'Mariachi',n:'One-hour minimum, depending on availability',p:'Ask'},\n      {t:'DJ and hosts',n:'Spanish and English, from the DJ booth',p:'$499'},\n      {t:'Karaoke',n:'In your own room',p:'$499'},\n      {t:'Lighting',n:'Our lighting system, into your room only or the bar too',p:'$499'},\n      {t:'Sound system',n:'Runs from the DJ booth into your room',p:'Included'}\n    ];\n    const dow = ['Su','Mo','Tu','We','Th','Fr','Sa'];\n    const dec = Array.from({length:31}, (_,i) => {\n      const d = i+1, w = (d+1) % 7;\n      let s = 'background:rgb(28,27,24);border:1px solid rgb(42,40,32);color:rgba(234,226,214,.8)';\n      if (d === 24 || d === 25) s = 'background:transparent;border:1px dashed rgb(42,40,32);color:rgba(234,226,214,.3);text-decoration:line-through';\n      else if (w === 5 || w === 6) s = 'background:rgb(214,188,133);color:rgb(18,18,16);border:1px solid rgb(214,188,133)';\n      return {d, s};\n    });\n    const shots = [\n      {c:'1a',sec:'Hero',what:'Foyer looking through to the Mexican Room, holiday lights up, dusk',crop:'Landscape 16:9, full bleed'},\n      {c:'1a',sec:'Rooms chapters',what:'Mexican Room set for a party, long tables, holiday décor',crop:'Landscape, full bleed, subject right'},\n      {c:'1a',sec:'Rooms chapters',what:'International Room set for a company dinner',crop:'Landscape, full bleed, subject right'},\n      {c:'1a',sec:'Rooms chapters',what:'Indoor Patio at night, string lights on',crop:'Landscape, full bleed'},\n      {c:'1a',sec:'Rooms chapters',what:'Bar Area with the DJ booth lit, people standing',crop:'Landscape, full bleed'},\n      {c:'1a 1c',sec:'Food',what:'Fajita buffet line, chicken and steak sizzling, tortillas',crop:'Portrait or square, tight on the pans'},\n      {c:'1a 1b 1c',sec:'Entertainment',what:'Mariachi band playing between tables',crop:'Landscape 3:2'},\n      {c:'1a 1c',sec:'Entertainment',what:'DJ booth lit in the bar area',crop:'Portrait 3:4'},\n      {c:'1a',sec:'Entertainment',what:'Karaoke, a guest singing, lights on',crop:'Portrait 3:4'},\n      {c:'1a 1b 1c',sec:'Proof',what:'Company group of about 25 at a long table, candid, mid-toast',crop:'Landscape 3:2'},\n      {c:'1a 1b 1c',sec:'Gift box',what:'Sealed holiday gift box with ribbon, on a table or stacked on the bar',crop:'Square top-down (1a, 1c), wide landscape (1b)'},\n      {c:'1a',sec:'Close',what:'Tomas in the International Room doorway, lights on',crop:'Landscape, subject left third'},\n      {c:'1b',sec:'Hero',what:'Long holiday table in the Mexican Room, overhead, candles, papel picado',crop:'Landscape 2:1, overhead'},\n      {c:'1b',sec:'Rooms grid',what:'Indoor Patio roofed, warm light, December',crop:'Landscape 4:3'},\n      {c:'1b',sec:'Food',what:'Hands pressing tortillas, flour dust',crop:'Landscape 16:9, tight'},\n      {c:'1b',sec:'Entertainment',what:'Mariachi trumpet player mid-note, warm light',crop:'Portrait, full half-page'},\n      {c:'1b',sec:'Proof strip',what:'Office team toast, retirement cake moment, big family dinner',crop:'Three landscape 4:3'},\n      {c:'1c',sec:'Hero',what:'International Room set for a company dinner, soft, wide',crop:'Landscape, dimmed behind the planner'},\n      {c:'1c',sec:'Food',what:'Printed menu card on a set table',crop:'Landscape 3:2'},\n      {c:'1c',sec:'Entertainment',what:'Lighting rig on in a private room',crop:'Landscape 3:2'},\n      {c:'1c',sec:'Close',what:'Tomas headshot',crop:'Square, circle crop'}\n    ];\n    return {nav, rooms, steps, faqs, ents, dow, dec, shots};\n  }\n  ny() {\n    const nav = ['Our Story','Menu','Takeout','Tacos','Happy Hour','Private Events','Catering','Game Day','Contact'];\n    const tl = [\n      {t:'3 PM',h:'Doors open',d:'Like any Thursday.',k:'All ages',cs:'',l:'Doors open',ld:'Like any Thursday. Families welcome all night.',r:'Bar opens',rd:'All ages until 9. No reservations in the bar.'},\n      {t:'Dinner',h:'Full menu, all ages',d:'In the dining rooms. Toast Tables for groups under 20, call for larger.',k:'Reservations',cs:'',l:'Dinner off the full menu',ld:'Reserve on Toast Tables under 20. Call for larger.',r:'First come, first served',rd:'The bar area fills before 9.'},\n      {t:'9 PM',h:'The masquerade begins',d:'Bar area turns 21 and over. $5 cover at the door. DJs, Spanish and English.',k:'21+ · $5',cs:'border-color:rgb(214,188,133);background:rgb(35,33,28)',l:'Dining rooms stay all ages',ld:'Eat late and still hear the countdown.',r:'Masks go on · 21+',rd:'$5 cover at the door. DJs, Spanish and English, sound up.'},\n      {t:'12',h:'Countdown and toast',d:'A champagne toast, on us.',k:'Midnight',cs:'',l:'Countdown',ld:'Heard from every room.',r:'Champagne toast, on us',rd:'The bar area sings it.'},\n      {t:'2 AM',h:'We close',d:'Last call is 15 minutes before.',k:'Last call 1:45',cs:'',l:'Kitchen closes',ld:'Last call 15 minutes before.',r:'We close',rd:'See you at 3 PM on New Year\\u2019s Day.'}\n    ];\n    const hours = [\n      {d:'December 24 and 25',t:'Closed',n:'Christmas Eve and Day',s:'color:rgba(234,226,214,.4)'},\n      {d:'December 31',t:'3 PM to 2 AM',n:'New Year\\u2019s Eve',s:''},\n      {d:'January 1',t:'From 3 PM',n:'Regular Friday hours',s:'color:rgb(246,239,228)'}\n    ];\n    const faqs = [\n      {q:'Is there a New Year\\u2019s Eve dinner near Germantown that takes reservations?',a:'Yes. Full menu, reservations for the dining rooms through Toast Tables for groups under 20. Families welcome all night. The bar area is first come, first served. 20021 Century Blvd, next to Topgolf, free parking.'},\n      {q:'Is the New Year\\u2019s Eve party 21 and over?',a:'The bar area is 21 and over from 9 PM. The dining rooms stay all ages the whole night.'},\n      {q:'How much is the cover on New Year\\u2019s Eve, and are there tickets?',a:'No tickets, no tiers. $5 for the bar area after 9 PM, at the door. Dinner has no cover. The midnight toast is complimentary.'},\n      {q:'Do I need a mask?',a:'It is a masquerade, so yes. Limited masks at the door while they last. Bring your own to be sure.'},\n      {q:'What time do you close on New Year\\u2019s Eve, and are you open New Year\\u2019s Day?',a:'Open 3 PM, close 2 AM, last call 15 minutes before. New Year\\u2019s Day from 3 PM. Closed December 24 and 25.'},\n      {q:'Can we reserve a table in the bar area for the countdown?',a:'No. The bar area is first come, first served and fills before 9. For a guaranteed spot, book a private room.'},\n      {q:'Can we book a private room for our own New Year\\u2019s Eve party?',a:'Yes. Rooms seat 48 to 112 with sound, lighting, mic and screen built in. Holiday rates apply. Tomas replies within 24 hours.'}\n    ];\n    const faqL = [faqs[0], faqs[4], faqs[6]];\n    const faqR = [faqs[1], faqs[2], faqs[3], faqs[5]];\n    const shots = [\n      {c:'2a',sec:'Hero',what:'Bar area at night, DJ booth, smoke machine, crowd under lights (video loop preferred)',crop:'Landscape 16:9, full bleed, dark edges'},\n      {c:'2a 2c',sec:'Dinner',what:'Molcajete arriving at the table, bubbling, family around it',crop:'Portrait (2a), square top-down (2c)'},\n      {c:'2a 2c',sec:'Private room',what:'International Room with lighting rig on, set for a party',crop:'Landscape, dimmed behind text'},\n      {c:'2a 2b 2c',sec:'Gift box',what:'Sealed holiday gift box',crop:'Square'},\n      {c:'2a',sec:'Close',what:'Champagne flutes raised under the bar lights',crop:'Landscape, heavily dimmed'},\n      {c:'2b',sec:'Hero 3 PM',what:'Late afternoon in the Mexican Room, sun through windows, a family being seated',crop:'Portrait 3:4'},\n      {c:'2b',sec:'Dinner',what:'Full table, fajitas sizzling, kids and grandparents',crop:'Portrait 3:4'},\n      {c:'2b 2c',sec:'9 PM',what:'Bar area with masks on, DJ booth lit, crowd',crop:'Portrait 3:4 (2b), landscape (2c door)'},\n      {c:'2b',sec:'Midnight',what:'Midnight toast, flutes up, confetti, smoke, wide (video preferred)',crop:'Landscape 16:9, full bleed'},\n      {c:'2b',sec:'Private room',what:'A private room with its own party, about 40 people, lights',crop:'Landscape 16:9'},\n      {c:'2c',sec:'Hero door one',what:'Family at a dinner table, warm, Mexican Room',crop:'Portrait, fades to cream at the bottom'},\n      {c:'2c',sec:'Masquerade detail',what:'Masks laid on the bar, lights behind',crop:'Landscape 16:9'}\n    ];\n    return {nav, tl, hours, faqs, faqL, faqR, shots};\n  }\n  br() {\n    const nav = ['Our Story','Menu','Takeout','Tacos','Happy Hour','Private Events','Catering','Game Day','Contact'];\n    const parts = [\n      {n:'1',t:'Birria beef',d:'Braised 8 hours, piled on',pos:'left:0;top:40px'},\n      {n:'2',t:'Ramen noodles',d:'Japanese, wheat, underneath',pos:'left:0;top:330px'},\n      {n:'3',t:'Consommé',d:'Ladled over everything',pos:'left:0;top:620px'},\n      {n:'4',t:'Corn, radish, onion',d:'On top, for crunch',pos:'right:0;top:40px'},\n      {n:'5',t:'Cilantro',d:'Fresh, last',pos:'right:0;top:330px'},\n      {n:'6',t:'Limes',d:'On the side, to cut it',pos:'right:0;top:620px'}\n    ];\n    const proc = [\n      {h:'0 h',t:'The beef goes in',d:'Tender beef, chile guajillo, chile de árbol, cloves, garlic.',ph:'PHOTO: Dried guajillo and árbol chiles, garlic, cloves on a board'},\n      {h:'2 h',t:'Low and slow',d:'The braise barely moves. The chiles give depth, not fire.',ph:'PHOTO: Pot lid on, steam escaping'},\n      {h:'8 h',t:'It falls apart',d:'The meat gives up. It is pulled, not cut.',ph:'PHOTO: Beef pulled with two forks'},\n      {h:'+',t:'The liquid becomes consommé',d:'The same red broth the quesabirria tacos are dipped in.',ph:'PHOTO: Ladle lifting glossy red consommé'},\n      {h:'Bowl',t:'Over the noodles',d:'Noodles soak it up for you. Corn, radish, onion, cilantro, limes.',ph:'PHOTO: Consommé poured over the assembled bowl'}\n    ];\n    const drinks = [\n      {t:'Michelada',n:'Cold, salted rim',ph:'PHOTO: Michelada, salted rim, condensation'},\n      {t:'Mexican Coke',n:'Glass bottle',ph:'PHOTO: Mexican Coke bottle, ice'},\n      {t:'Negra Modelo',n:'Dark, carbonated',ph:'PHOTO: Negra Modelo poured, foam'}\n    ];\n    const tiles = [\n      {n:'8 hrs',t:'In the braise',d:'Guajillo, árbol, cloves, garlic'},\n      {n:'Mild',t:'As served',d:'Salsa diabla on request'},\n      {n:'$21',t:'A full meal',d:'Most people do not finish it'},\n      {n:'2021',t:'On the menu since',d:'A top ten seller'}\n    ];\n    const spices = ['Chile guajillo','Chile de árbol','Cloves','Garlic','Eight hours'];\n    const faqs = [\n      {q:'What is birria ramen?',a:'Japanese ramen noodles in birria consommé, topped with braised birria beef, corn, radish, onion and cilantro, lime on the side. Beef braised eight hours with guajillo, chile de árbol, cloves and garlic. On the menu since 2021.'},\n      {q:'How much is the birria ramen, and how big is it?',a:'$21, and a full meal for one. Most people do not finish it. Not on the happy hour menu.'},\n      {q:'Is birria ramen spicy?',a:'Mild as served. The chiles are there for depth, not heat. Ask for salsa diabla for more.'},\n      {q:'Does the birria ramen have allergens?',a:'The noodles are wheat. Tell your server about any other allergy.'},\n      {q:'Can I get birria ramen for takeout or delivery?',a:'Yes. The consommé is packed separately. Pickup through Toast up to 15 minutes before close, or DoorDash, Uber Eats, Grubhub.'},\n      {q:'What is the difference between birria ramen and birria tacos?',a:'Same braise, same consommé. Tacos dip, ramen soaks. Many tables order one of each.'},\n      {q:'What should I drink with birria ramen?',a:'Something cold and carbonated: a michelada, a Mexican Coke, or a Negra Modelo.'}\n    ];\n    const shots = [\n      {c:'3a 3c',sec:'Hero / bowl',what:'The bowl, top down, every component visible, consommé glossy, limes at the rim',crop:'Square, circle crop (3a), 4:5 (3c)'},\n      {c:'3a',sec:'Process strip',what:'Dried chiles with garlic and cloves, pot with lid, pulled beef, ladle of consommé, pour over the bowl',crop:'Five landscape 4:3'},\n      {c:'3a 3c',sec:'Story',what:'Alex and Roberto Rivas in the kitchen, birria pot between them',crop:'Portrait 3:4 (3a), landscape (3c)'},\n      {c:'3a 3b 3c',sec:'Drinks',what:'Michelada with salted rim, Mexican Coke bottle on ice, Negra Modelo poured',crop:'Three portrait 3:4'},\n      {c:'3a',sec:'Takeout',what:'Takeout containers open, consommé in its own cup, noodles separate',crop:'Landscape 4:3'},\n      {c:'3a 3b 3c',sec:'Local',what:'Map: 20021 Century Blvd next to Topgolf, 10-minute ring to Gaithersburg',crop:'Landscape, dark style'},\n      {c:'3a',sec:'Close',what:'Chopsticks lifting noodles from the bowl, steam',crop:'Landscape 16:9, heavily dimmed'},\n      {c:'3b',sec:'Hero',what:'The trunk of a parked car at dusk, foil-covered pot and bundle of tortillas on it, suburban street (staged recreation if no 2020 photo)',crop:'Landscape 16:9, full bleed'},\n      {c:'3b',sec:'Chapter one',what:'Alex at a home stove, 2020, phone snapshot quality is fine',crop:'Landscape 16:9'},\n      {c:'3b',sec:'Stills',what:'Roberto tasting from a spoon, handmade tortillas in a cloth, the first 2021 menu with Birria Ramen on it',crop:'Three portrait 3:4'},\n      {c:'3b',sec:'Payoff',what:'The bowl, hero angle, steam, dark background, dramatic side light (video of steam preferred)',crop:'Landscape 16:9, full bleed'},\n      {c:'3c',sec:'Hero',what:'The bowl, 3/4 angle, steam, chopsticks resting',crop:'Portrait 4:5'},\n      {c:'3c',sec:'Braise',what:'The braise pot, ladle lifting consommé, red and glossy',crop:'Landscape 2:1'}\n    ];\n    return {nav, parts, proc, drinks, tiles, spices, faqs, shots};\n  }\n  renderVals() {\n    const hp = this.hp(), ny = this.ny(), br = this.br();\n    const pick = (list, id, page) => list.filter(s => s.c.split(' ').includes(id)).map(s => ({...s, c: page}));\n    const shots = [...pick(hp.shots, '1a', 'Holiday Parties'), ...pick(ny.shots, '2a', 'New Year\\u2019s Eve'), ...pick(br.shots, '3c', 'Birria Ramen')];\n    return {nav: hp.nav, hp, ny, br, shots};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
